name: Misaki image with Genshin

# 手動実行のみ。公開後も本番のcomposeや稼働containerは変更しない。
on:
  workflow_dispatch:

# 既存Docker workflowと同じ範囲。既存GITHUB_TOKENのみ使用する。
permissions:
  contents: read
  packages: write

jobs:
  build:
    # ローカル参照は呼び出し元の不変commitから解決される。
    uses: ./.github/workflows/build-with-plugins.yml
    with:
      mk_repository: ${{ github.repository }}
      mk_ref: ${{ github.sha }}
      plugins: |
        genshin https://github.com/Misaki-Project/mk-plugin-genshin.git 97eefa37bab74827df764bb8f3a482903c890c98
      image: ghcr.io/misaki-project/mk-genshin
      # 再実行でも既存tagを上書きしない。
      tags: rolelevel-20261002-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      push: true
